version: '3.9'

services:
  swarm-mother:
      image: ghcr.io/openai/agents-sandbox:latest
          container_name: swarm-mother
              hostname: swarm-mother
                  volumes:
                        - ./workspace:/workspace
                              - ./outputs:/outputs
                                    - ./memory:/memory
                                          - ./logs:/logs
                                              environment:
                                                    - AGENT_ROLE=MOTHER
                                                          - NODE_ID=00
                                                                - SWARM_SIZE=20
                                                                      - EVOLUTION_LEVEL=GOD_TIER
                                                                            - HUMAN_HANDSHAKE_REQUIRED=true
                                                                                ports:
                                                                                      - "8080:8080"
                                                                                          deploy:
                                                                                                resources:
                                                                                                        limits:
                                                                                                                  cpus: '4.0'
                                                                                                                            memory: 8G
                                                                                                                                restart: unless-stopped

                                                                                                                                  swarm-chaos:
                                                                                                                                      image: ghcr.io/openai/agents-sandbox:latest
                                                                                                                                          container_name: swarm-chaos
                                                                                                                                              hostname: chaos-architect
                                                                                                                                                  volumes:
                                                                                                                                                        - ./workspace:/workspace
                                                                                                                                                              - ./logs:/logs
                                                                                                                                                                  environment:
                                                                                                                                                                        - AGENT_ROLE=CHAOS_ARCHITECT
                                                                                                                                                                              - PERSONALITY=ruthless
                                                                                                                                                                                    - SPECIALTY=breaking_systems
                                                                                                                                                                                          - HUMAN_HANDSHAKE_REQUIRED=true
                                                                                                                                                                                              deploy:
                                                                                                                                                                                                    resources:
                                                                                                                                                                                                            limits:
                                                                                                                                                                                                                      cpus: '2.0'
                                                                                                                                                                                                                                memory: 4G
                                                                                                                                                                                                                                    restart: unless-stopped

                                                                                                                                                                                                                                      swarm-speed:
                                                                                                                                                                                                                                          image: ghcr.io/openai/agents-sandbox:latest
                                                                                                                                                                                                                                              container_name: swarm-speed
                                                                                                                                                                                                                                                  hostname: speed-demon
                                                                                                                                                                                                                                                      volumes:
                                                                                                                                                                                                                                                            - ./workspace:/workspace
                                                                                                                                                                                                                                                                  - ./logs:/logs
                                                                                                                                                                                                                                                                      environment:
                                                                                                                                                                                                                                                                            - AGENT_ROLE=SPEED_DEMON
                                                                                                                                                                                                                                                                                  - PERSONALITY=hyperactive
                                                                                                                                                                                                                                                                                        - SPECIALTY=velocity
                                                                                                                                                                                                                                                                                              - HUMAN_HANDSHAKE_REQUIRED=true
                                                                                                                                                                                                                                                                                                  deploy:
                                                                                                                                                                                                                                                                                                        resources:
                                                                                                                                                                                                                                                                                                                limits:
                                                                                                                                                                                                                                                                                                                          cpus: '2.0'
                                                                                                                                                                                                                                                                                                                                    memory: 4G
                                                                                                                                                                                                                                                                                                                                        restart: unless-stopped

                                                                                                                                                                                                                                                                                                                                          swarm-architect:
                                                                                                                                                                                                                                                                                                                                              image: ghcr.io/openai/agents-sandbox:latest
                                                                                                                                                                                                                                                                                                                                                  container_name: swarm-architect
                                                                                                                                                                                                                                                                                                                                                      hostname: architect-core
                                                                                                                                                                                                                                                                                                                                                          volumes:
                                                                                                                                                                                                                                                                                                                                                                - ./workspace:/workspace
                                                                                                                                                                                                                                                                                                                                                                      - ./logs:/logs
                                                                                                                                                                                                                                                                                                                                                                          environment:
                                                                                                                                                                                                                                                                                                                                                                                - AGENT_ROLE=ARCHITECT
                                                                                                                                                                                                                                                                                                                                                                                      - PERSONALITY=visionary
                                                                                                                                                                                                                                                                                                                                                                                            - SPECIALTY=system_design
                                                                                                                                                                                                                                                                                                                                                                                                  - HUMAN_HANDSHAKE_REQUIRED=true
                                                                                                                                                                                                                                                                                                                                                                                                      deploy:
                                                                                                                                                                                                                                                                                                                                                                                                            resources:
                                                                                                                                                                                                                                                                                                                                                                                                                    limits:
                                                                                                                                                                                                                                                                                                                                                                                                                              cpus: '1.5'
                                                                                                                                                                                                                                                                                                                                                                                                                                        memory: 3G
                                                                                                                                                                                                                                                                                                                                                                                                                                            restart: unless-stopped

                                                                                                                                                                                                                                                                                                                                                                                                                                              swarm-redteam:
                                                                                                                                                                                                                                                                                                                                                                                                                                                  image: ghcr.io/openai/agents-sandbox:latest
                                                                                                                                                                                                                                                                                                                                                                                                                                                      container_name: swarm-redteam
                                                                                                                                                                                                                                                                                                                                                                                                                                                          hostname: red-team-psycho
                                                                                                                                                                                                                                                                                                                                                                                                                                                              volumes:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    - ./workspace:/workspace
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          - ./logs:/logs
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              environment:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    - AGENT_ROLE=RED_TEAM
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          - PERSONALITY=unhinged
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                - SPECIALTY=vulnerability_hunting
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      - HUMAN_HANDSHAKE_REQUIRED=true
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          deploy:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                resources:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        limits:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  cpus: '2.0'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            memory: 4G
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                restart: unless-stopped

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  swarm-metadata:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      image: ghcr.io/openai/agents-sandbox:latest
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          container_name: swarm-metadata
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              hostname: metadata-ghost
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  volumes:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        - ./workspace:/workspace
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              - ./logs:/logs
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  environment:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        - AGENT_ROLE=METADATA_GHOST
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              - PERSONALITY=paranoid
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    - SPECIALTY=metadata_forensics
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          - HUMAN_HANDSHAKE_REQUIRED=true
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              deploy:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    resources:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            limits:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      cpus: '1.0'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                memory: 2G
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    restart: unless-stopped

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    networks:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      swarm-net:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          driver: bridge
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              driver_opts:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    com.docker.network.bridge.name: swarm-net

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    